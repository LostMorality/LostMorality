name: fill in the time card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python .profile/build.py --strict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the new numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "$(head -c 64 /dev/urandom | tr -dc 'a-z0-9' | head -c 6)"
          git push
