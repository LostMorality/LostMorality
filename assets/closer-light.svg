<clipPath id="door"><path d="M34 8H806L832 34V396H8V34Z"/></clipPath><radialGradient id="pool" gradientUnits="userSpaceOnUse" cx="640" cy="120" r="420"><stop offset="0" stop-color="#FFD9A0" stop-opacity=".55"/><stop offset=".35" stop-color="#FFB85C" stop-opacity=".32"/><stop offset="1" stop-color="#FFB85C" stop-opacity="0"/></radialGradient></defs><path d="M34 8H806L832 34V396H8V34Z" fill="#17181F" filter="url(#drop)"/><g stroke="#262833" stroke-width="2" fill="none"><path d="M40 40H800V366H40Z"/></g><rect x="2" y="70" width="14" height="60" rx="3" fill="url(#steel)"/><rect x="2" y="280" width="14" height="60" rx="3" fill="url(#steel)"/><g class="lit" clip-path="url(#door)"><rect x="8" y="8" width="824" height="388" fill="url(#pool)"/></g><g class="eyes"><ellipse cx="470" cy="70" rx="9" ry="6" fill="#2FA8F5"/><ellipse cx="510" cy="70" rx="9" ry="6" fill="#2FA8F5"/></g><path d="M120 14L170 70M280 14L230 70" stroke="#6F7385" stroke-width="3" stroke-dasharray="7 4"/><circle cx="120" cy="14" r="4" fill="#6F7385"/><circle cx="280" cy="14" r="4" fill="#6F7385"/><rect x="70" y="68" width="260" height="110" rx="5" fill="#F1F1F6" filter="url(#small)"/><rect x="78" y="76" width="244" height="94" rx="3" fill="none" stroke="#1B1C24" stroke-width="2"/><text x="200" y="150" class="s" font-size="72" fill="#1B1C24" text-anchor="middle">Closed</text><text x="52" y="240" class="r" font-size="42" fill="#B9A8F0">Knock loud.</text><text x="52" y="282" class="r" font-size="42" fill="#B9A8F0">I'm in the back.</text><g stroke="#8C90A3" fill="none"><path d="M650 8v22" stroke-width="3"/><path d="M700 40v44" stroke-width="1.6" stroke-dasharray="3 3"/></g><path d="M618 30h64l18 40h-100z" fill="#3A3C48"/><ellipse cx="650" cy="70" rx="50" ry="7" fill="#FFD9A0"/><circle cx="700" cy="88" r="3.5" fill="#8C90A3"/><g transform="rotate(-.8 600 200)"><rect x="412" y="96" width="382" height="190" fill="#ECE7DB" filter="url(#small)"/><text x="428" y="126" class="c" font-size="20" fill="#1B1C24">On Discord: nolifepops. Bug</text><text x="428" y="152" class="c" font-size="20" fill="#1B1C24">reports go in my repos. For</text><text x="428" y="178" class="c" font-size="20" fill="#1B1C24">seanime, ask the people who</text><text x="428" y="204" class="c" font-size="20" fill="#1B1C24">built it.</text><text x="428" y="234" class="b" font-size="20" fill="#1B1C24">Tell me what broke and what</text><text x="428" y="260" class="b" font-size="20" fill="#1B1C24">you tried.</text></g><g class="lit"><text x="428" y="340" class="r" font-size="44" fill="#FFB85C">Forgot to turn that off.</text></g><text x="790" y="372" class="r" font-size="31" fill="#FFD9A0" text-anchor="end">Did you eat?</text></svg>