<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 0 842 404" width="842" height="404"><style>@font-face{font-family:bs;src:url(data:font/woff2;base64,) format('woff2')}.s{font-family:bs,monospace;}@font-face{font-family:rb;src:url(data:font/woff2;base64,) format('woff2')}.r{font-family:rb,monospace;stroke-width:.4px;paint-order:stroke;}@font-face{font-family:cp;src:url(data:font/woff2;base64,) format('woff2')}.c{font-family:cp,monospace;}@font-face{font-family:cb;src:url(data:font/woff2;base64,) format('woff2')}.b{font-family:cb,monospace;}text{white-space:pre}.r{stroke:currentColor}.s{letter-spacing:.025em}.lit{animation:lit 24s linear infinite}@keyframes lit{0%,88.9%{opacity:1}89%,99.3%{opacity:0}99.4%,100%{opacity:1}}.eyes{opacity:0;animation:eyes 24s linear infinite}@keyframes eyes{0%,89%{opacity:0}89.5%,93%{opacity:1}93.2%,93.9%{opacity:0}94%,99.2%{opacity:1}99.3%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
